{% extends "base.html" %}

{% block title %}Entrar{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-1">Entrar</h1>
        <p class="text-body-secondary small mb-4">
          Acesse com e-mail e senha. Dados no SQLite, senha com hash.
        </p>
        <form method="POST">
          <div class="mb-3">
            <label for="email" class="form-label">E-mail</label>
            <input
              type="email"
              class="form-control"
              id="email"
              name="email"
              placeholder="seu@email.com"
              required
            />
          </div>
          <div class="mb-3">
            <label for="senha" class="form-label">Senha</label>
            <div class="input-group">
              <input
                type="password"
                class="form-control"
                id="senha"
                name="senha"
                placeholder="Sua senha"
                required
              />
              <button
                type="button"
                class="btn btn-outline-secondary btn-toggle-senha"
                data-target="senha"
                title="Mostrar senha"
                aria-label="Mostrar senha"
              >
                <i class="bi bi-eye"></i>
              </button>
            </div>
          </div>
          <button type="submit" class="btn btn-primary w-100">Entrar</button>
        </form>
        <p class="text-body-secondary small mt-3 mb-0 text-center">
          Nao tem conta?
          <a href="{{ url_for('cadastro') }}">Cadastre-se</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
