{% extends "base.html" %}

{% block title %}Cadastro{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-1">Criar conta</h1>
        <p class="text-body-secondary small mb-4">
          A senha e salva com hash — nunca em texto puro no banco.
        </p>
        <form method="POST">
          <div class="mb-3">
            <label for="nome" class="form-label">Nome</label>
            <input
              type="text"
              class="form-control"
              id="nome"
              name="nome"
              placeholder="Seu nome"
              required
            />
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">E-mail</label>
            <input
              type="email"
              class="form-control"
              id="email"
              name="email"
              placeholder="seu@email.com"
              required
            />
          </div>
          <div class="mb-3">
            <label for="senha" class="form-label">Senha</label>
            <div class="input-group">
              <input
                type="password"
                class="form-control"
                id="senha"
                name="senha"
                placeholder="Minimo 6 caracteres"
                minlength="6"
                required
              />
              <button
                type="button"
                class="btn btn-outline-secondary btn-toggle-senha"
                data-target="senha"
                title="Mostrar senha"
                aria-label="Mostrar senha"
              >
                <i class="bi bi-eye"></i>
              </button>
            </div>
          </div>
          <div class="mb-3">
            <label for="confirmar" class="form-label">Confirmar senha</label>
            <div class="input-group">
              <input
                type="password"
                class="form-control"
                id="confirmar"
                name="confirmar"
                placeholder="Repita a senha"
                minlength="6"
                required
              />
              <button
                type="button"
                class="btn btn-outline-secondary btn-toggle-senha"
                data-target="confirmar"
                title="Mostrar senha"
                aria-label="Mostrar senha"
              >
                <i class="bi bi-eye"></i>
              </button>
            </div>
          </div>
          <button type="submit" class="btn btn-warning w-100">Cadastrar</button>
        </form>
        <p class="text-body-secondary small mt-3 mb-0 text-center">
          Ja tem conta?
          <a href="{{ url_for('login') }}">Faca login</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
